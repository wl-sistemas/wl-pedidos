<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0f766e">
  <title>Acompanhar pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20261022b">
  <link rel="stylesheet" href="css/cardapio.css?v=20261022b">
</head>
<body>
  <div id="carregando" class="carregando"><div class="girando"></div><span>Buscando seu pedido…</span></div>

  <div id="erroTela" class="erro-tela oculto">
    <h1>Pedido não encontrado</h1>
    <p id="erroTexto">Confira se o link está completo.</p>
  </div>

  <main id="app" class="pagina-estreita acomp oculto">
    <div class="acomp-topo">
      <img id="lojaLogo" class="oculto" alt="">
      <div>
        <h1 id="lojaNome"></h1>
        <p id="pedidoHora"></p>
      </div>
    </div>

    <div class="comanda">
      <p class="conf-rotulo">Seu pedido</p>
      <p class="comanda-numero acomp-numero" id="pedidoNumero"></p>
      <p class="acomp-status" id="pedidoStatus"></p>
      <p id="pedidoMotivo" class="aviso erro oculto"></p>
      <ol id="etapas" class="etapas"></ol>
      <hr class="tracejado">
      <ul id="listaItens" class="lista-itens"></ul>
      <hr class="tracejado">
      <div class="linha-valor" id="linhaTaxa"><span>Taxa de entrega</span><span id="valTaxa"></span></div>
      <div class="linha-valor linha-total"><span>Total</span><span id="valTotal"></span></div>
      <p class="linha-valor" id="linhaPagamento"></p>
    </div>

    <div class="acomp-acoes">
      <a id="btnWhatsapp" class="btn btn-cor btn-bloco" target="_blank" rel="noopener" href="#">Falar com a loja</a>
      <a id="btnCardapio" class="btn btn-bloco" href="#">Voltar ao cardápio</a>
    </div>
    <p class="rodape" id="atualizado"></p>
  </main>

  <script src="config.js?v=20261022b"></script>
  <script src="js/util.js?v=20261022b"></script>
  <script src="js/api.js?v=20261022b"></script>
  <script src="js/demo.js?v=20261022b"></script>
  <script src="js/acompanhar.js?v=20261022b"></script>
</body>
</html>
